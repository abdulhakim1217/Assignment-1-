<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warm up DOM assignment</title>
</head>
<body>

    <h1>Welcome</h1>

    <p id="message">My name is Abdul Karim Hakim</p>

    <button id="revealBtn">Reveal Secret</button>

    <!-- 
        Script is placed at the end of the body so that:
        1. HTML content loads first (better user experience)
        2. JavaScript runs only after the DOM elements exist
        3. Page rendering is not blocked by JavaScript
    -->
    <script src="script.js"></script>

</body>
</html>
